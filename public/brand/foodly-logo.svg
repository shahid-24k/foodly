<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 48" fill="none">
  <defs>
    <linearGradient id="foodlyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6A38C2" />
      <stop offset="100%" stop-color="#42D2B8" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF5E7E" />
      <stop offset="100%" stop-color="#FFA84A" />
    </linearGradient>
  </defs>

  <!-- Modern App Icon Badge -->
  <g transform="translate(4, 4)">
    <rect width="40" height="40" rx="13" fill="url(#foodlyGrad)" />
    
    <!-- Modern Food Cloche / Plate / Fork Symbol -->
    <!-- Cloche dome -->
    <path d="M12 25 C12 16.5, 28 16.5, 28 25 Z" fill="#FFFFFF" opacity="0.95" />
    <!-- Cloche handle -->
    <circle cx="20" cy="14.5" r="2.2" fill="#FFFFFF" />
    <!-- Plate base -->
    <rect x="10" y="26.5" width="20" height="2.5" rx="1.25" fill="#FFFFFF" />
    <!-- Speed / Freshness steam spark -->
    <path d="M25 12 C26.5 10, 29 11, 28 13.5 C27 15, 24.5 14, 25 12 Z" fill="url(#accentGrad)" />
  </g>

  <!-- Clean Bold Modern Wordmark -->
  <text x="54" y="32" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="900" font-size="22" letter-spacing="-0.03em" fill="#2D3748">
    FOOD<tspan fill="#6A38C2">LY</tspan>
  </text>
  
  <!-- Subtle Dot Accent -->
  <circle cx="152" cy="30" r="3" fill="#42D2B8" />
</svg>
