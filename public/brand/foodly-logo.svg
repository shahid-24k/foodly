<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 48" fill="none">
  <defs>
    <linearGradient id="royalGreenLogoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B6E4F" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
  </defs>

  <!-- Modern App Icon Badge in Royal Green -->
  <g transform="translate(4, 4)">
    <rect width="40" height="40" rx="14" fill="url(#royalGreenLogoGrad)" />
    <!-- Cloche dome -->
    <path d="M11 26 C11 17.5, 29 17.5, 29 26 Z" fill="#F7F5F0" opacity="0.95" />
    <!-- Cloche handle -->
    <circle cx="20" cy="15.5" r="2.2" fill="#F7F5F0" />
    <!-- Plate base -->
    <rect x="9" y="28" width="22" height="2.5" rx="1.25" fill="#F7F5F0" />
  </g>

  <!-- Handwritten Brand Wordmark -->
  <text x="56" y="33" font-family="'Indie Flower', cursive, sans-serif" font-weight="bold" font-size="28" fill="#1A2820">
    FOOD<tspan fill="#0B6E4F">LY</tspan>
  </text>
  
  <!-- Subtle Dot Accent -->
  <circle cx="168" cy="30" r="3.5" fill="#10B981" />
</svg>
